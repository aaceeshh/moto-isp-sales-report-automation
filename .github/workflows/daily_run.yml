name: ISP Sales Report Automation

on:
  schedule:
    - cron: "30 5 * * *"     # 11:00 AM IST
    - cron: "30 8 * * *"     # 02:00 PM IST
    - cron: "30 10 * * *"    # 04:00 PM IST
    - cron: "30 12 * * *"    # 06:00 PM IST
    - cron: "30 13 * * *"    # 07:00 PM IST
    - cron: "0 14 * * *"     # 07:30 PM IST
    - cron: "30 14 * * *"    # 08:00 PM IST
    - cron: "0 15 * * *"     # 08:30 PM IST
    - cron: "30 15 * * *"    # 09:00 PM IST
    - cron: "0 16 * * *"     # 09:30 PM IST
    - cron: "30 16 * * *"    # 10:00 PM IST
    - cron: "0 17 * * *"     # 10:30 PM IST
    - cron: "30 17 * * *"    # 11:00 PM IST
    - cron: "0 18 * * *"     # 11:30 PM IST
    - cron: "29 18 * * *"    # 11:59 PM IST
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run ISP Automation Script
        env:
          # Portal Credentials
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
          
          # Google Drive Configuration
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          
          # Ashish's Personal OAuth Credentials (The Identity Fix)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python main.py
