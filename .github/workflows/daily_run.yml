name: ISP Sales Report Automation

on:
  schedule:
    # Every 15 minutes, 10:00 AM – 11:59 PM IST, every day. (UTC = IST − 5:30)
    - cron: "30,45 4 * * *"     # 10:00, 10:15 AM IST
    - cron: "*/15 5-17 * * *"   # 10:30 AM – 11:15 PM IST (every 15 min)
    - cron: "0,15 18 * * *"     # 11:30, 11:45 PM IST
    - cron: "29 18 * * *"       # 11:59 PM IST
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # hard cap so a hung Selenium run can't burn hours at 15-min cadence

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run ISP Automation Script
        env:
          # Portal Credentials
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}

          # Google Drive Configuration
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          # Ashish's Personal OAuth Credentials (The Identity Fix)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python main.py
