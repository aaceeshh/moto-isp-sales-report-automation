name: ISP Sales Report Automation

on:
  schedule:
    # ===== TEMPORARY denser schedule — ONLY 10–21 Oct (auto-reverts 22 Oct) =====
    - cron: "0 6 10-21 10 *"     # 11:30 AM IST
    - cron: "30 6 10-21 10 *"    # 12:00 PM IST
    - cron: "0 7 10-21 10 *"     # 12:30 PM IST
    - cron: "30 7 10-21 10 *"    # 01:00 PM IST
    - cron: "0 8 10-21 10 *"     # 01:30 PM IST
    - cron: "30 8 10-21 10 *"    # 02:00 PM IST
    - cron: "0 10 10-21 10 *"    # 03:30 PM IST
    - cron: "30 10 10-21 10 *"   # 04:00 PM IST
    - cron: "30 11 10-21 10 *"   # 05:00 PM IST
    - cron: "30 12 10-21 10 *"   # 06:00 PM IST
    - cron: "30 13 10-21 10 *"   # 07:00 PM IST
    - cron: "0 14 10-21 10 *"    # 07:30 PM IST
    - cron: "30 14 10-21 10 *"   # 08:00 PM IST
    - cron: "0 15 10-21 10 *"    # 08:30 PM IST
    - cron: "30 15 10-21 10 *"   # 09:00 PM IST
    - cron: "0 16 10-21 10 *"    # 09:30 PM IST
    - cron: "30 16 10-21 10 *"   # 10:00 PM IST
    - cron: "0 17 10-21 10 *"    # 10:30 PM IST
    - cron: "30 17 10-21 10 *"   # 11:00 PM IST
    - cron: "0 18 10-21 10 *"    # 11:30 PM IST
    - cron: "29 18 10-21 10 *"   # 11:59 PM IST
    # ===== FALLBACK schedule — every day EXCEPT 10–21 Oct (Oct 1-9/22-31 + all non-Oct months) =====
    - cron: "30 5 1-9,22-31 10 *"
    - cron: "30 5 * 1-9,11,12 *"     # 11:00 AM IST
    - cron: "30 8 1-9,22-31 10 *"
    - cron: "30 8 * 1-9,11,12 *"     # 02:00 PM IST
    - cron: "30 10 1-9,22-31 10 *"
    - cron: "30 10 * 1-9,11,12 *"    # 04:00 PM IST
    - cron: "30 12 1-9,22-31 10 *"
    - cron: "30 12 * 1-9,11,12 *"    # 06:00 PM IST
    - cron: "30 13 1-9,22-31 10 *"
    - cron: "30 13 * 1-9,11,12 *"    # 07:00 PM IST
    - cron: "0 14 1-9,22-31 10 *"
    - cron: "0 14 * 1-9,11,12 *"     # 07:30 PM IST
    - cron: "30 14 1-9,22-31 10 *"
    - cron: "30 14 * 1-9,11,12 *"    # 08:00 PM IST
    - cron: "0 15 1-9,22-31 10 *"
    - cron: "0 15 * 1-9,11,12 *"     # 08:30 PM IST
    - cron: "30 15 1-9,22-31 10 *"
    - cron: "30 15 * 1-9,11,12 *"    # 09:00 PM IST
    - cron: "0 16 1-9,22-31 10 *"
    - cron: "0 16 * 1-9,11,12 *"     # 09:30 PM IST
    - cron: "30 16 1-9,22-31 10 *"
    - cron: "30 16 * 1-9,11,12 *"    # 10:00 PM IST
    - cron: "0 17 1-9,22-31 10 *"
    - cron: "0 17 * 1-9,11,12 *"     # 10:30 PM IST
    - cron: "30 17 1-9,22-31 10 *"
    - cron: "30 17 * 1-9,11,12 *"    # 11:00 PM IST
    - cron: "0 18 1-9,22-31 10 *"
    - cron: "0 18 * 1-9,11,12 *"     # 11:30 PM IST
    - cron: "29 18 1-9,22-31 10 *"
    - cron: "29 18 * 1-9,11,12 *"    # 11:59 PM IST
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run ISP Automation Script
        env:
          # Portal Credentials
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}

          # Google Drive Configuration
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}

          # Ashish's Personal OAuth Credentials (The Identity Fix)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python main.py
