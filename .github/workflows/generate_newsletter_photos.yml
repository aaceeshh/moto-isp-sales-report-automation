name: Daily Newsletter Photos (9 AM IST)

# Renders the 5 newsletter leaderboard sections as redesigned PNG cards and
# posts each to Telegram as a photo. Runs at 9:00 AM IST daily.
# 9:00 AM IST = 03:30 UTC.
on:
  workflow_dispatch:        # manual trigger
  schedule:
    - cron: '30 3 * * *'    # 9:00 AM IST

jobs:
  newsletter-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render and send newsletter photos
        env:
          NEWSLETTER_URL:     ${{ secrets.NEWSLETTER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_newsletter_photos.py
