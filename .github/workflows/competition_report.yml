name: Competition Sales - Not Reported

# Pulls the Nural Competition Sales Report and sends a TSI-wise Telegram list of
# East Reliance ISDs who have NOT reported competition sales.
#   9:00 AM IST -> yesterday (D-1),  6:00 PM & 9:00 PM IST -> today (FTD).
on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send to Telegram? 1 = send, 0 = dry-run (print only)"
        required: false
        default: "1"
      day_offset:
        description: "Day offset: 0 = today (FTD), 1 = yesterday (D-1). Blank = auto by schedule."
        required: false
        default: ""
  schedule:
    - cron: '30 3 * * *'    # 9:00 AM IST  -> D-1 (yesterday)
    - cron: '30 12 * * *'   # 6:00 PM IST  -> FTD (today)
    - cron: '30 15 * * *'   # 9:00 PM IST  -> FTD (today)

jobs:
  competition-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch competition report and send Telegram
        env:
          PYTHONUNBUFFERED:     "1"
          PORTAL_USER:          ${{ secrets.PORTAL_USER }}
          PORTAL_PASS:          ${{ secrets.PORTAL_PASS }}
          TARGETS_CSV_URL:      ${{ secrets.TARGETS_CSV_URL }}
          WEEKOFF_CSV_URL:      ${{ secrets.WEEKOFF_CSV_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM:        ${{ github.event.inputs.send_telegram || '1' }}
          # D-1 only on the 9 AM cron; manual runs can override via the day_offset input.
          DAY_OFFSET:           ${{ github.event.inputs.day_offset || (github.event.schedule == '30 3 * * *' && '1' || '0') }}
        run: python fetch_competition_nural.py
