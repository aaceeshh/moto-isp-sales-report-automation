name: Competition Sales - Not Reported

# Pulls the Nural Competition Sales Report for today (FTD) and sends a TSI-wise
# Telegram list of East Reliance ISDs who have NOT reported competition sales.
# Runs at 6:00 PM and 9:00 PM IST.
on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Send to Telegram? 1 = send, 0 = dry-run (print only)"
        required: false
        default: "1"
  schedule:
    - cron: '30 12 * * *'   # 6:00 PM IST
    - cron: '30 15 * * *'   # 9:00 PM IST

jobs:
  competition-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright openpyxl
          python -m playwright install --with-deps chromium
      - name: Fetch competition report and send Telegram
        env:
          PORTAL_USER:          ${{ secrets.PORTAL_USER }}
          PORTAL_PASS:          ${{ secrets.PORTAL_PASS }}
          TARGETS_CSV_URL:      ${{ secrets.TARGETS_CSV_URL }}
          WEEKOFF_CSV_URL:      ${{ secrets.WEEKOFF_CSV_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM:        ${{ github.event.inputs.send_telegram || '1' }}
        run: python fetch_competition_nural.py
